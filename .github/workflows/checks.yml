name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Optional test dependencies
        run: python -m pip install --disable-pip-version-check numpy pyyaml
      - name: Conventions, lint and plain-Python tests
        run: python -B tools/run_checks.py
