# World spec - the single source of truth every agent builds against.
# Copy to <world>/world/spec.yaml at stage 0 and replace every value in world and tools with the intake answers.
# Only version, world, tools and the budget ceilings belong here at stage 0; the planning task (T-SPEC-01 and
# T-KIT-PLAN, or T-PLAN-01 in small scale) tightens the budgets and adds the other sections.
# Schema: ../references/world-spec.md; a complete spec: ../references/example-spec.yaml.
# Coordinates are Blender world metres: X east, Y north, Z up. Rotations are degrees about Z.
version: 1

world:
  name: My World                    # the world's working name
  platforms: [pc, quest]            # pc, quest (the Android build), ios - asked at intake
  scale: full                       # full | small (one zone, about 30 pieces or fewer)
  allow_generated_assets: false     # props only, and only if the user allows it at intake
  mockups: false                    # true only with a concept-art tool the user confirmed (else stage 1 is skipped)
  style: "Era, materials, palette, time of day, weather in one line"

tools:                              # detected at intake, confirmed by the user
  blender: C:/Users/me/.blender/blender-5.2.2/blender.exe   # the Blender CLI path
  blender_mcp: false                # Blender MCP connected: MASTER and ASM tasks use the live Blender
  unity_project: C:/Users/me/Unity/MyWorld
  substance_designer: false
  substance_painter: false
  rizomuv: false
  unity_packages: [com.vrchat.worlds]   # installed packages the plan may use (UdonSharp and ClientSim ship inside it)
  build_modules: [windows]             # Unity build support installed: windows, android, ios

budgets:                            # ceilings: the Quest targets (vrchat-world-optimization), binding with mobile;
                                    # a PC-only world may raise them to the PC targets. The planner tightens them to
                                    # the world and adds piece_tris and lightmap
  world_tris: 250000
  view_tris: 100000
  materials: 25
  setpass: 50
  batches: 150
  texture_vram_mb: 150
  download_mb: {pc: 200, quest: 100}   # add ios: 100 with ios; mobile hard limit 100 MB, MB = 2^20 bytes

# Added by the planning task, in this order (world-spec.md has each section's fields):
# grid, families, pieces, assemblies, zones, elevations, views, interactivity, lighting
