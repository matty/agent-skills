# Pipeline ledger - the master agent's memory. Copy to <world>/world/ledger.yaml at stage 0.
# Only the master agent writes this file. Fields and rules: ../references/ledger.md
version: 1
world: My World                       # world.name from the spec
stage: 0                              # the stage the master is working on
updated: 2026-10-17T09:00:00Z         # UTC from the clock, at every write

intake:                               # what the spec does not hold; the answers live in the spec's world and tools
  world_root: C:/Users/me/Worlds/MyWorld   # the folder holding world/, blender/ and export/
  brief: >-
    The user's request in their own words: the place, mood, size, references and must-have interactions.
  answers: []                         # the user's intake replies, verbatim: {question, answer}
  skills_declined: []                 # skills the user chose not to install (QA marks their checks not-run, owner user)
  blend_layout: single                # single (default: KIT, ASM and layout as collections in blender/MASTER.blend)
                                      # or split (separate KIT and ASM files), only when the user asked for it
  blend_layout_by: null               # split only: the user's words asking for separate files

gates:                                # user approvals; tasks list them in deps as gate:<name>
  spec:
    status: pending                   # pending | approved | changes-requested
    after: [T-SPEC-01]                # tasks that must be done before asking; small scale: [T-PLAN-01]
    by: null
    at: null
    notes: ""
    history: []                       # earlier decisions, kept when the gate re-opens: {status, by, at, notes}
    reopened_by: null                 # the task whose output re-opened the gate (it may run under it)
  greybox:
    status: pending
    after: [T-GREY-MASTER]
    by: null
    at: null
    notes: ""
    history: []
    reopened_by: null
  look:                               # the lead family's materials, before the other families are textured
    status: pending
    after: [T-TEX-EXT]                # the lead family's (look.lead_family) texture task; small scale: [T-TEX-WORLD]
    by: null
    at: null
    notes: ""
    history: []
    reopened_by: null

tasks:                                # stage 0 adds the first tasks; the planner drafts the rest into
                                      # world/briefs/draft-tasks.yaml and the master merges them before the spec gate
  - id: T-SPEC-01                     # small scale: T-PLAN-01 (stages 1-3 in one task, still stage: 2),
                                      # with gates.spec.after above set to it
    stage: 2
    title: Write spec.yaml and its diagrams, and draft the stage 3-13 tasks
    role: planner
    deps: []                          # with mockups: [T-MOCK-01], a stage 1 task added the same way
    writes: [world/spec.yaml, world/diagrams/, world/briefs/draft-tasks.yaml]
    status: todo                      # todo | running | qa | done | failed | escalated | blocked | skipped
    attempts: 0
    brief: world/briefs/T-SPEC-01.md
    report: world/reports/T-SPEC-01.yaml
    qa: world/reports/qa/T-SPEC-01/verdict.yaml   # small scale: world/reports/qa/stage-<n>/verdict.yaml

flags:
  generated_assets: []                # props made with generate_3d or imported from a library: {piece, source, task}
  overrides: []                       # library overrides in ASM or MASTER files: {file, object, reason}
  open_conflicts: []                  # unresolved placement-sync conflicts: {scope, id, why}
  user_actions: []                    # what only the user can do (installs, sign-in, uploads, reviews):
                                      # {what, why, task, since}

log:                                  # append-only, newest last; every `at` from the UTC clock
  - {at: 2026-10-17T09:00:00Z, event: "ledger created"}
